name: Build macOS app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend and database schema
        run: npm test
      - name: Test native operations on macOS
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build app and DMG
        run: ./node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.macos.conf.json
      - name: Verify and package output
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict "$app_path"
          hdiutil verify "$dmg_path"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/混剪素材整理助手-${{ matrix.target }}.app.zip"
          cp "$dmg_path" "release/混剪素材整理助手-${{ matrix.target }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: 混剪素材整理助手-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
